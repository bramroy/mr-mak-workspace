name: Bob native Windows build (isolated candidate)

on:
  workflow_dispatch:
  push:
    branches:
      - bob/browser-backed-tabs-v01

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          package-manager-cache: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: node --test desktop/service/test/browser-tabs.test.mjs desktop/service/test/browser-tabs-api.test.mjs desktop/service/test/bob-questions.test.mjs
      - name: Prepare bundled Node and Tauri resources
        run: npm run desktop:prepare
      - name: Check native Bob URL and IPC guards
        run: cargo test --manifest-path src-tauri/Cargo.toml bob_tabs::tests
      - name: Build native Windows Tauri executable and installer
        run: npm exec -- tauri build --ci --bundles nsis
      - name: Upload candidate only (no installation)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mrmak-bob-windows-candidate
          path: |
            src-tauri/target/release/mrmak-workspace.exe
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 7
